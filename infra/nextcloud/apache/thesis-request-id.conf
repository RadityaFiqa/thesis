# Correlation (Phase 2, LOG-01): use the proxy's request id as Nextcloud's reqId.
# Nextcloud takes $_SERVER['UNIQUE_ID'] as its request id when present, so the
# same UUID appears in Caddy's access log (request_id) and in Nextcloud's
# audit/application logs (reqId). Caddy always overwrites X-Request-Id, and the
# app container is reachable only through Caddy, so clients can't choose it.
SetEnvIf X-Request-Id "^([A-Za-z0-9-]{8,64})$" UNIQUE_ID=$1
