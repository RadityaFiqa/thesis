# Nextcloud project (PRD INF-01, INF-02, INF-03, INF-06, INF-09, INF-10)
# Independent of the SIEM project: no shared Docker network. The Wazuh agent
# reaches the manager through ports the SIEM project publishes on the host
# bridge address (HOST_BIND_IP), resolved here as "wazuh-manager.host".
name: nextcloud

services:
  # One-shot: give the shared log volume to www-data (uid 33) so Nextcloud can
  # write it and the agent can read it.
  logs-init:
    image: busybox:1.37.0
    command: ["sh", "-c", "chown 33:33 /logs/nextcloud && chmod 0755 /logs/nextcloud"]
    volumes:
      - nc_logs:/logs/nextcloud
    restart: "no"

  db:
    image: postgres:17.11-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [nc_net]

  redis:
    image: redis:7.4.11-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--save", "", "--appendonly", "no"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [nc_net]

  app:
    image: nextcloud:34.0.5-apache
    restart: unless-stopped
    depends_on:
      logs-init: { condition: service_completed_successfully }
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD}
      NEXTCLOUD_TRUSTED_DOMAINS: ${NEXTCLOUD_DOMAIN}
      REDIS_HOST: redis
      REDIS_HOST_PASSWORD: ${REDIS_PASSWORD}
      # Reverse proxy / client IP (PRD CTX-03). Only the Caddy container is a
      # trusted proxy; Caddy rewrites X-Forwarded-For to the resolved client IP.
      TRUSTED_PROXIES: ${CADDY_IP}
      FORWARDED_FOR_HEADERS: HTTP_X_FORWARDED_FOR
      APACHE_DISABLE_REWRITE_IP: "1"
      OVERWRITEPROTOCOL: https
      OVERWRITEHOST: ${NEXTCLOUD_DOMAIN}${PUBLIC_PORT_SUFFIX:-}
      OVERWRITECLIURL: https://${NEXTCLOUD_DOMAIN}${PUBLIC_PORT_SUFFIX:-}
      PHP_MEMORY_LIMIT: 1G
      PHP_UPLOAD_LIMIT: 10G
    volumes:
      - nc_html:/var/www/html
      - nc_data:/var/www/html/data
      - nc_logs:/var/log/nextcloud
      - ./hooks/before-starting:/docker-entrypoint-hooks.d/before-starting:ro
      - ./apache/thesis-request-id.conf:/etc/apache2/conf-enabled/thesis-request-id.conf:ro
    healthcheck:
      test: ["CMD", "php", "-r", "$$s = json_decode(@file_get_contents('http://localhost/status.php')); exit(($$s && $$s->installed && !$$s->maintenance) ? 0 : 1);"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 600s
    networks: [nc_net]

  cron:
    image: nextcloud:34.0.5-apache
    restart: unless-stopped
    entrypoint: /cron.sh
    depends_on:
      app: { condition: service_healthy }
    volumes:
      - nc_html:/var/www/html
      - nc_data:/var/www/html/data
      - nc_logs:/var/log/nextcloud
    networks: [nc_net]

  caddy:
    image: caddy:2.11.6-alpine
    restart: unless-stopped
    depends_on:
      app: { condition: service_started }
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    environment:
      NEXTCLOUD_DOMAIN: ${NEXTCLOUD_DOMAIN}
      WAZUH_DOMAIN: ${WAZUH_DOMAIN}
      CADDY_TLS: ${CADDY_TLS}
      WAZUH_ALLOWED_CIDRS: ${WAZUH_ALLOWED_CIDRS}
      WAZUH_DASHBOARD_UPSTREAM: ${WAZUH_DASHBOARD_UPSTREAM}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/certs:/etc/caddy/certs:ro
      - caddy_data:/data
      - caddy_config:/config
      - caddy_logs:/var/log/caddy
    networks:
      nc_net:
        ipv4_address: ${CADDY_IP}

  wazuh-agent:
    image: wazuh/wazuh-agent:4.14.9
    restart: unless-stopped
    hostname: nextcloud-agent
    depends_on:
      logs-init: { condition: service_completed_successfully }
    environment:
      # Host endpoint, never localhost or the manager's internal service name (PRD INF-07)
      WAZUH_MANAGER_SERVER: wazuh-manager.host
      WAZUH_MANAGER_PORT: "1514"
      WAZUH_REGISTRATION_SERVER: wazuh-manager.host
      WAZUH_REGISTRATION_PORT: "1515"
      WAZUH_REGISTRATION_PASSWORD: ${WAZUH_REGISTRATION_PASSWORD}
      WAZUH_AGENT_NAME: ${WAZUH_AGENT_NAME}
      WAZUH_AGENT_GROUP: default
    extra_hosts:
      - "wazuh-manager.host:host-gateway"
    volumes:
      - ./wazuh-agent/ossec.conf:/wazuh-config-mount/etc/ossec.conf:ro
      - agent_etc:/var/ossec/etc          # keeps client.keys -> stable identity (INF-08)
      - nc_logs:/var/log/nextcloud:ro     # read-only log access (INF-06)
      - caddy_logs:/var/log/caddy:ro
    networks: [nc_net]

networks:
  nc_net:
    driver: bridge
    ipam:
      config:
        - subnet: ${NC_SUBNET}

volumes:
  db_data:
  nc_html:
  nc_data:
  nc_logs:
  caddy_data:
  caddy_config:
  caddy_logs:
  agent_etc:
