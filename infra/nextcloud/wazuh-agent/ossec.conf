<!--
  Wazuh agent for the Nextcloud project (PRD INF-06, INF-07, INF-08).
  CHANGE_* placeholders are filled from environment variables by the agent
  image's entrypoint on every start.
  Only log collection is enabled; host-integrity modules (rootcheck, syscheck,
  SCA, syscollector) would inspect the container, not the VPS, so they're off.
-->
<ossec_config>
  <client>
    <server>
      <address>CHANGE_MANAGER_IP</address>
      <port>CHANGE_MANAGER_PORT</port>
      <protocol>tcp</protocol>
    </server>
    <notify_time>10</notify_time>
    <time-reconnect>60</time-reconnect>
    <auto_restart>yes</auto_restart>
    <crypto_method>aes</crypto_method>
    <enrollment>
      <enabled>yes</enabled>
      <manager_address>CHANGE_ENROLL_IP</manager_address>
      <port>CHANGE_ENROLL_PORT</port>
      <agent_name>CHANGE_AGENT_NAME</agent_name>
      <authorization_pass_path>etc/authd.pass</authorization_pass_path>
      <groups>CHANGE_AGENT_GROUP</groups>
    </enrollment>
  </client>

  <client_buffer>
    <disabled>no</disabled>
    <queue_size>20000</queue_size>
    <events_per_second>500</events_per_second>
  </client_buffer>

  <rootcheck>
    <disabled>yes</disabled>
  </rootcheck>

  <syscheck>
    <disabled>yes</disabled>
  </syscheck>

  <sca>
    <enabled>no</enabled>
  </sca>

  <wodle name="syscollector">
    <disabled>yes</disabled>
  </wodle>

  <wodle name="cis-cat">
    <disabled>yes</disabled>
  </wodle>

  <wodle name="osquery">
    <disabled>yes</disabled>
  </wodle>

  <active-response>
    <disabled>yes</disabled>
  </active-response>

  <!-- Nextcloud audit log: logins, file access, shares, user changes (JSON lines) -->
  <localfile>
    <log_format>json</log_format>
    <location>/var/log/nextcloud/audit.log</location>
  </localfile>

  <!-- Nextcloud application log (JSON lines) -->
  <localfile>
    <log_format>json</log_format>
    <location>/var/log/nextcloud/nextcloud.log</location>
  </localfile>

  <!-- Reverse-proxy access log: client IP, method, URI, status, bytes (JSON lines) -->
  <localfile>
    <log_format>json</log_format>
    <location>/var/log/caddy/access.log</location>
  </localfile>

  <logging>
    <log_format>plain</log_format>
  </logging>
</ossec_config>
